name: "EMS Package"
description: "generate production data package for EMS"
inputs:
  exclude-patterns:
    description: "File patterns to exclude from package. Patterns must be white space separated"
    required: false
    default: ""
  access-token:
    description: "Personal access token for private repos"
    required: true

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v4
      with:
        submodules: "recursive"
        token: ${{ inputs.access-token }}

    - name: Build EMS packages
      shell: bash
      env:
        EXCLUDE_PATTERNS: ${{ inputs.exclude-patterns }}
        REVISION: ${{ github.ref_name }}
      run: python3 "${GITHUB_ACTION_PATH}/scripts/package.py"

    - name: Upload ZIPs to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ inputs.access-token }}
        file: ZIP/*.zip
        file_glob: true
        tag: ${{ github.ref }}
        overwrite: true
